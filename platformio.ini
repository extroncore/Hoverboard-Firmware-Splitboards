[platformio]
src_dir = HoverBoardGigaDevice
include_dir = HoverBoardGigaDevice/Inc
default_envs = gd32f130k6_master, gd32f130k6_slave

; Common settings shared by all environments (no board here — the chipset
; is selected per environment group below)
[env]
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
platform_packages =
    framework-spl-gd32@https://github.com/CommunityGD32Cores/gd32-pio-spl-package.git
framework = spl
board_build.f_cpu = 72000000L
build_src_filter =
    -<*>
    +<Src/>
    +<RTE/Device/GD32F130C8/system_gd32f1x0.c>
upload_protocol = stlink
debug_tool = stlink

; ================================================================
; GD32F130K6 (32KB flash / 4KB RAM) — actual chip on these boards
; ================================================================
[gd32f130k6]
board = genericGD32F130K6

[env:gd32f130k6_master]
extends = gd32f130k6
build_flags = -DMASTER

[env:gd32f130k6_slave]
extends = gd32f130k6
build_flags = -DSLAVE

; ================================================================
; GD32F130C8 (64KB flash / 8KB RAM) — original chip targeted by
; the Keil project and README
; ================================================================
[gd32f130c8]
board = genericGD32F130C8

[env:gd32f130c8_master]
extends = gd32f130c8
build_flags = -DMASTER

[env:gd32f130c8_slave]
extends = gd32f130c8
build_flags = -DSLAVE
